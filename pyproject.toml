[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nwsig"
dynamic = ["version"]
description = "Nadaraya-Watson regression and classification on path space with signature metrics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "Christian Bayer" },
    { name = "Davit Gogolashvili" },
    { name = "Luca Pelizzari" },
]
keywords = ["path signature", "rough paths", "Nadaraya-Watson", "kernel regression", "time series"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "torch>=2.0",
    "numba>=0.56",
    "iisignature>=0.24",
]

[project.optional-dependencies]
examples = ["aeon>=0.6", "matplotlib>=3.5", "pandas", "jupyter>=1.0"]
kernel = ["sigkernel"]
test = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/Davit1123/nw-signature"
Paper = "https://proceedings.mlr.press/v300/bayer26a.html"

[tool.setuptools]
packages = ["nwsig"]

[tool.setuptools.dynamic]
version = { attr = "nwsig.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
